<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon-source.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100d1a" />
    <meta name="description" content="Lofi 음악과 뽀모도로 타이머로 집중을 돕는 아늑한 웹앱" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Lo-Fi Focus · 뽀모도로 타이머</title>
    <script>
      // 테마 깜빡임(FOUC) 방지 — React 로드 전에 미리 data-theme 적용
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("lofi-theme") || '"midnight"');
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
